name: embedded-observability

services:
  phoenix:
    image: arizephoenix/phoenix:20.25.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-data:/app/data

volumes:
  phoenix-data:
  uptime-data:
