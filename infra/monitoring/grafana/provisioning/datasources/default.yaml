apiVersion: 1
datasources:
  - name: Prometheus
    uid: metrics
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Operational logs
    uid: logs
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: Phoenix Trace
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          url: 'http://127.0.0.1:6006/projects/${PHOENIX_PROJECT_ID}/spans/$${__value.raw}'
