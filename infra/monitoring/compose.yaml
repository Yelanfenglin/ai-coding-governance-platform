name: embedded-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    mem_limit: 384m
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - rag

  grafana:
    image: grafana/grafana:13.2.4
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_UNIFIED_ALERTING_STATE_HISTORY_ENABLED: "true"
      GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND: loki
      GF_UNIFIED_ALERTING_STATE_HISTORY_LOKI_REMOTE_URL: http://loki:3100
      PHOENIX_PROJECT_ID: "${PHOENIX_PROJECT_ID:-}"
    secrets:
      - grafana_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    mem_limit: 64m
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/config.yaml]
    volumes:
      - ./blackbox.yaml:/etc/blackbox/config.yaml:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    mem_limit: 128m
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  loki:
    image: grafana/loki:3.7.9
    mem_limit: 256m
    restart: unless-stopped
    command: [-config.file=/etc/loki/local.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/local.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.2
    mem_limit: 128m
    restart: unless-stopped
    command: [run, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345,
              /etc/alloy/config.alloy]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ../../output/service_logs:/var/log/embedded:ro
      - alloy-data:/var/lib/alloy

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  rag:
    external: true
    name: rag-milvus-net

secrets:
  grafana_password:
    file: ../../output/monitoring_secrets/grafana_password
