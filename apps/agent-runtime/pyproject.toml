[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-governance-agent-runtime"
version = "0.1.0"
description = "ReAct-style agent runtime: turn/step loop, tool execution, and session event log"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "opentelemetry-api>=1.45,<2", "prometheus-client>=0.22,<1",
                "tree-sitter>=0.25.2,<0.26", "tree-sitter-c>=0.24,<0.25"]

[project.scripts]
agent-runtime = "app.cli:main"
agent-evaluate = "evaluation.runner:main"
agent-web = "app.web:main"

[project.optional-dependencies]
observability = ["opentelemetry-sdk>=1.45,<2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
http = ["httpx>=0.28,<1"]
web = ["httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2",
       "prometheus-fastapi-instrumentator>=8.1,<9"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.16,<1"]
evaluation = ["hypothesis>=6.100,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evaluation*"]

[tool.setuptools.package-data]
"app.demos" = ["SKILL.md"]
"app.skills" = ["*/SKILL.md"]
"evaluation" = ["cases/*.json", "fixtures/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: requires an explicitly configured external test dependency",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# output/ 是验收产物与上游源码缓存，不属于本包代码。
exclude = [".venv", "output", "evaluation/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
