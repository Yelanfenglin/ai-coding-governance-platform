[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-governance-rag-parser"
version = "0.1.0"
description = "RAG API for product specification knowledge"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opentelemetry-api>=1.45,<2",
  "prometheus-client>=0.22,<1",
  "prometheus-fastapi-instrumentator>=8.1,<9",
  "Pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymilvus==2.6.17",
  "PyMuPDF>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tenacity>=9,<10",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
observability = ["opentelemetry-sdk>=1.45,<2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
layout = [
  "paddleocr>=3.7,<4",
  "paddlepaddle>=3.3,<4",
]
dev = [
  "asgi-lifespan>=2.1,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires an explicitly configured external test dependency",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
