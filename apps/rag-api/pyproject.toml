[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-governance-rag-parser"
version = "0.1.0"
description = "Deterministic parser for product specification PDFs"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
layout = [
  "paddleocr>=3.7,<4",
  "paddlepaddle>=3.3,<4",
]
test = [
  "pytest>=8.4,<9",
  "ruff>=0.16,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
